name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/SECURITY.md"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/SECURITY.md"
  workflow_dispatch:
    inputs:
      run-integration-tests:
        description: "Run integration tests (manual opt-in, useful for PR branches)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    name: Maven CI
    uses: ktestify/.github/.github/workflows/reusable-maven-ci.yml@main
    with:
      java-version: "25"
      run-integration-tests: ${{ github.event_name == 'workflow_dispatch' && inputs.run-integration-tests || true }}
      maven-opts: ""







