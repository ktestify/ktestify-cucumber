# ============================================================
# ============================================================
# Integration Tests — Testcontainers + Cucumber @integration
#
# Triggered on:
#   - Manual dispatch (workflow_dispatch)   → any branch, optional tag filter
#   - Push / PR to main (paths that affect integration behaviour)
#
# What it does:
#   1. Builds ktestify-core (local install — no Maven Central needed)
#   2. Runs `mvn verify -Pintegration-tests` on ktestify-cucumber
#      → CucumberIntegrationIT starts Kafka + Schema Registry via
#        Testcontainers, then runs all @integration Cucumber scenarios
#        in-process via the Cucumber CLI
#   3. Uploads the Cucumber JSON report as a run artefact
#   4. Posts a sticky summary to the PR (if triggered by a PR)
# ============================================================
name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Cucumber tag filter (e.g. @integration, @xmlMatch)"
        required: false
        default: "@integration"
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "pom.xml"
      - "../ktestify-core/src/**"
      - "../ktestify-core/pom.xml"
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "pom.xml"
      - "../ktestify-core/src/**"
      - "../ktestify-core/pom.xml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  JAVA_VERSION: "25"
  MAVEN_OPTS: >-
    -Xmx2048m
    -XX:+EnableDynamicAgentLoading
    -Dmaven.repo.local=${{ github.workspace }}/.m2/repository
  # Tag filter: manual input wins, otherwise default to @integration
  CUCUMBER_TAGS: ${{ inputs.tags || '@integration' }}

permissions:
  contents: read

# ──────────────────────────────────────────────────────────────
jobs:

  integration-tests:
    name: 🧪 Integration Tests (${{ inputs.tags || '@integration' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # for the sticky PR comment

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java ──────────────────────────────────────────────
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # ── 4. Run integration tests via Testcontainers ───────────
      #
      # CucumberIntegrationIT (picked up by maven-failsafe-plugin) will:
      #   • Start Kafka (apache/kafka:4.2.0) via Testcontainers
      #   • Start Schema Registry (confluentinc/cp-schema-registry:7.9.0) via Testcontainers
      #   • Wire dynamic host/port values into KtestifyConfig
      #   • Execute all Cucumber scenarios matching the supplied tag filter
      # ─────────────────────────────────────────────────────────
      - name: 🧪 Run integration tests (Testcontainers + Cucumber)
        working-directory: ktestify-cucumber
        run: |
          mvn verify \
            --no-transfer-progress \
            -Pintegration-tests \
            -Dspotless.check.skip=true \
            -Dcucumber.it.tags="${{ env.CUCUMBER_TAGS }}"

      # ── 5. Upload Cucumber JSON report ────────────────────────
      - name: 📦 Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ github.run_id }}
          path: ktestify-cucumber/target/cucumber-reports/cucumber.json
          retention-days: 30

      # ── 6. Parse Cucumber JSON → Step Summary + PR comment ────
      - name: 📊 Generate integration test report
        if: always()
        run: |
          python3 << 'PYEOF'
          import json, os, sys

          report_path = 'ktestify-cucumber/target/cucumber-reports/cucumber.json'
          if not os.path.exists(report_path):
              print('Cucumber report not found — skipping summary.')
              sys.exit(0)

          with open(report_path) as f:
              features = json.load(f)

          total = passed = failed = skipped = 0
          failed_scenarios = []

          for feature in features:
              for element in feature.get('elements', []):
                  if element.get('type') != 'scenario':
                      continue
                  steps = element.get('steps', [])
                  statuses = [s.get('result', {}).get('status', 'skipped') for s in steps]
                  if 'failed' in statuses:
                      total += 1
                      failed += 1
                      failed_scenarios.append(
                          f"{feature.get('name','?')} — {element.get('name','?')}"
                      )
                  elif 'skipped' in statuses or 'pending' in statuses:
                      total += 1
                      skipped += 1
                  else:
                      total += 1
                      passed += 1

          status = '✅' if failed == 0 else '❌'
          tags   = os.environ.get('CUCUMBER_TAGS', '@integration')

          lines = [
              f'## {status} Integration Test Results — `{tags}`\n',
              '| | Metric | Count |',
              '|:---:|:---|---:|',
              f'| ✅ | Passed   | {passed}  |',
              f'| ❌ | Failed   | {failed}  |',
              f'| ⏭️ | Skipped  | {skipped} |',
              f'| 📊 | **Total**| **{total}** |',
          ]

          if failed_scenarios:
              lines += ['', '### ❌ Failed Scenarios']
              for s in failed_scenarios[:20]:
                  lines += [f'- {s}']
              if len(failed_scenarios) > 20:
                  lines += [f'- *… and {len(failed_scenarios) - 20} more*']

          report = '\n'.join(lines) + '\n'

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(report)
          with open('/tmp/integration-report.md', 'w') as f:
              f.write(report)

          print(report)
          PYEOF

      - name: 💬 Post integration report to PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/integration-report.md')) {
              console.log('Integration report file not found — skipping comment.');
              return;
            }

            const marker  = '<!-- ktestify-integration-report -->';
            const runUrl  = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const content = fs.readFileSync('/tmp/integration-report.md', 'utf8');
            const body    = `${marker}\n${content}\n---\n*🔄 [Integration run #${process.env.GITHUB_RUN_NUMBER}](${runUrl}) · ${new Date().toUTCString()}*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              per_page:     100,
            });

            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log(`✅ Updated integration report comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log('✅ Created new integration report comment');
            }


