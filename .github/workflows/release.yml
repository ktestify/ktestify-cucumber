# ============================================================
# Release — Publish ktestify-cucumber to Maven Central + GHCR
#
# Select a bump type — the reusable workflow calculates
# the release version and next SNAPSHOT automatically.
# Also pushes a multi-arch Docker image to GHCR via JIB.
# ============================================================
name: Release

permissions:
  contents: write
  packages: write
  pull-requests: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      bump-type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - bugfix
          - minor
          - major
          - release-candidate
      dry-run:
        description: "Dry run — build & sign but skip publish, tag & GitHub Release"
        required: false
        default: false
        type: boolean

jobs:
  release:
    uses: ktestify/.github/.github/workflows/reusable-maven-release.yml@main
    with:
      bump-type: ${{ inputs.bump-type }}
      dry-run: ${{ inputs.dry-run }}
      release-name-prefix: "ktestify-cucumber"
      update-readme-badge: true
      push-container: true
      container-image: "ghcr.io/ktestify/ktestify-cucumber"
      release-artifacts: |
        target/ktestify-cucumber.jar
        target/ktestify-cucumber-sources.jar
        target/ktestify-cucumber-javadoc.jar
        target/jib-image.digest
    secrets:
      KTESTIFY_CHANGELOG_PAT: ${{ secrets.KTESTIFY_CHANGELOG_PAT }}
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
