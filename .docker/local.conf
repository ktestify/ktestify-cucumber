# ktestify-cucumber — local dev config
# Points at the docker-compose stack in /docker/
#
# Use with:
#   KTESTIFY_CONFIG_FILE=docker/local.conf java -jar target/ktestify-cucumber.jar
#   or
#   java -Dconfig.file=docker/local.conf -jar target/ktestify-cucumber.jar

ktestify {
  kafka {
    bootstrap-servers = "localhost:9092"
    consumer-group-id = "ktestify-local"
    # Default namespace prepended to all topic names: "<namespace>.<topicName>"
    # Can also be set per-scenario with 'Given namespace' step.
    topic-namespace = "ktestify"
    topic-namespace = ${?KTESTIFY_TOPIC_NAMESPACE}
  }
  schema-registry {
    url = "http://localhost:8081"
  }
  framework {
    directories {
      # Absolute path — works regardless of where the JAR is launched from.
      # Change this to match your checkout location.
      assets = "/home/nil/Documents/ktestify/ktestify-cucumber/src/test/resources/data"
      assets = ${?KTESTIFY_ASSETS_DIR}
    }
    # Reporting settings
    reporting {
      enabled = true
      format = "html"
      output = "src/target/reports/report.html"
      output = ${?KTESTIFY_OUTPUT_DIR}
    }
  }
}



